    <button data-do="mapFull">${ui.mapFull ? 'Esci da tutto schermo' : '⛶ Tutto schermo'}</button></div>`;
  // la tavolozza: accanto alla mappa, oppure staccata dove l'hai trascinata
  const p = ui.palPos, palette = body => `<aside class="palette ${p ? 'floating' : ''} ${ui.palMin ? 'min' : ''}" ${p ? `style="left:${Math.min(p.x, innerWidth - 160)}px;top:${Math.min(p.y, innerHeight - 50)}px"` : ''}>
    <div class="palhead" title="Trascina per spostare gli strumenti"><b>Strumenti</b><span class="spacer"></span>
      ${p ? '<button data-do="palDock" title="Rimetti accanto alla mappa">Aggancia</button>' : ''}<button data-do="palMin" aria-label="${ui.palMin ? 'Mostra' : 'Riduci'} gli strumenti">${ui.palMin ? 'Mostra' : '—'}</button></div>
    ${ui.palMin ? '' : `<div class="palbody" data-sk="pal">${body}</div>`}</aside>`;
  const stage = (body, svg) => `<div class="panel mapstage ${ui.mapFull ? 'full' : ''}">${bar}
    <div class="mapbody ${p ? '' : 'docked'}">${palette(body)}<div class="mapscroll" data-sk="map">${svg}</div></div></div>`;

  const lv = curLevel(cur), view = levelView(cur, lv);
  const levels = [...cur.levels].sort((a, b) => b.z - a.z); // il piano più alto in cima
  const levelBar = `<div class="toolgroup"><label>Piani</label><nav class="levels">
    ${master ? `<button data-do="levelAdd" data-arg="up" data-mid="${cur.id}">+ Piano sopra</button>` : ''}
    ${levels.map(l => `<button data-do="levelPick" data-arg="${l.id}" data-mid="${cur.id}" class="${l === lv ? 'on' : ''}">${esc(l.name)}</button>`).join('')}
    ${master ? `<button data-do="levelAdd" data-arg="down" data-mid="${cur.id}">+ Piano sotto</button>` : ''}</nav></div>`;
  const tool = (on, d, extra, pic, label) => `<button type="button" class="tool ${on ? 'on' : ''}" data-do="${d}" ${extra} aria-pressed="${on}">${pic}<span>${label}</span></button>`;
  const group = (label, items) => `<div class="toolgroup"><label>${label}</label><div class="tools">${items}</div></div>`;
  // segnalini: il master li muove tutti, il giocatore solo i suoi
  const movable = Object.values(S.characters).filter(c => master || c.owner === S.me.id);
  const where = c => { const t = cur.tokens?.[c.id], l = t && cur.levels.find(x => x.id === t.lv); return !l ? ' (fuori)' : l === lv ? '' : ` (${l.name})`; };
  const tokBar = group('Personaggi', movable.map(c => tool(ui.tokChar === c.id, 'tokPick', `data-arg="${c.id}"`, tokIcon(c), esc((c.name || 'Senza nome') + where(c)))).join('')
    + (cur.tokens?.[ui.tokChar] && movable.some(c => c.id === ui.tokChar)
      ? tool(false, 'tokRemove', `data-arg="${ui.tokChar}" data-mid="${cur.id}"`, icon('<path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="#e5484d" stroke-width="1.2" stroke-linecap="round"/>'), 'Togli dalla mappa') : '')
    || '<span class="muted">Nessun personaggio da mettere sulla mappa.</span>');
  const tokHint = 'Scegli un personaggio e clicca sulla mappa per metterlo lì, anche su un altro piano. Trascina un segnalino per spostarlo.';
  if (!master) return stage(`${cur.levels.length > 1 ? levelBar : ''}${tokBar}${movable.length ? `<p class="muted">${tokHint}</p>` : ''}`, mapSvg(view, 'tok'));

  const b = ui.brush, ob = ui.obj, mode = ui.mapMode;
  const M_ = (f, label) => `<div><label>${label}</label><input type="number" class="n" min="1" max="12" data-m="${f}" data-mid="${cur.id}" value="${cur[f]}"></div>`;
  let tools, hint;
  if (mode === 'brush') {
    tools = group('Tipo di tassello', KINDS.map(([v, l]) => tool(b.kind === v, 'brushSet', `data-f="kind" data-v="${v}"`, kindIcon(v), l)).join(''))
      + (b.kind === 'corr' ? group('Larghezza', [[2, '3 m'], [4, '6 m']].map(([v, l]) => tool(num(b.w) === v, 'brushSet', `data-f="w" data-v="${v}"`,
        icon(`<rect width="10" height="10" fill="url(#tex-roccia)"/><rect x="${5 - v / 2}" width="${v}" height="10" fill="url(#tex-pietra)"/>`), l)).join('')) : '')
      + (b.kind === 'vuoto' ? '' : group('Materiale', Object.entries(TERRAIN).map(([v, l]) => tool(b.terrain === v, 'brushSet', `data-f="terrain" data-v="${v}"`,
        icon(`<rect width="10" height="10" fill="url(#tex-${v})"/>`, '0 0 3 3'), l)).join('')))
      + (b.kind !== 'vuoto' && b.terrain === 'acqua' ? (() => {
        const w = hex(b.water), waterIcon = c => icon(`<rect width="3" height="3" fill="${c}"/><rect width="3" height="3" fill="url(#tex-onde)"/>`, '0 0 3 3');
        return group('Tipo di acqua', WATER.map(([c, l]) => tool(w === c, 'brushSet', `data-f="water" data-v="${c}"`, waterIcon(c), l)).join('')
          + `<label class="tool ${WATER.some(([c]) => c === w) ? '' : 'on'}" style="cursor:pointer">${waterIcon(w)}<span>Altro colore</span>
            <input type="color" data-water value="${w}" aria-label="Colore dell'acqua" style="position:absolute;opacity:0;width:1px;height:1px"></label>`);
      })() : '');
    hint = 'Clic su un tassello per dipingerlo. I corridoi si collegano da soli ai tasselli vicini; tra due stanze apri tu il passaggio.';
  } else if (mode === 'edge') {
    tools = group('Strumento per i lati', EDGE_TOOLS.map(([v, l]) => tool(String(ui.edgeTool) === String(v), 'edgeTool', `data-arg="${v}"`, edgeIcon(v), l)).join(''));
    hint = 'Clic su un pallino per mettere lo strumento scelto su quel lato, anche sul bordo esterno. Con <b>Apri / chiudi</b> apri e chiudi porte e finestre durante la partita: i giocatori lo vedono subito. <b>Aperto</b> toglie il muro e unisce due stanze grandi in una sala. Trascina una porta o una finestra per spostarla lungo il muro: si aggancia da sola ai muri vicini.';
  } else if (mode === 'tok') {
    tools = tokBar;
    hint = tokHint;
  } else {
    const sample = { ...ob, type: OBJ[ob.type] ? ob.type : 'stairs' };
    tools = OBJ_GROUPS.map(([g, gl]) => group(gl, Object.entries(OBJ).filter(([, o]) => o[3] === g)
        .map(([v, [, , l]]) => tool(ob.type === v, 'objSet', `data-f="type" data-v="${v}"`, objIcon({ type: v, ladder: true }), l)).join(''))).join('')
      + group('Strumenti', tool(ob.type === 'ruin', 'objSet', 'data-f="type" data-v="ruin"', objIcon({ type: 'stairs', ruined: true }), 'Rovina / ripara')
        + tool(ob.type === 'erase', 'objSet', 'data-f="type" data-v="erase"', icon('<path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="#e5484d" stroke-width="1.2" stroke-linecap="round"/>'), 'Gomma'))
      + (OBJ[ob.type] ? group('Opzioni', [
        CLIMB.has(ob.type) ? tool(ob.dir !== 'down', 'objSet', 'data-f="dir" data-v="up"', objIcon({ ...sample, dir: 'up', rot: 0 }), 'Sale') + tool(ob.dir === 'down', 'objSet', 'data-f="dir" data-v="down"', objIcon({ ...sample, dir: 'down', rot: 0 }), 'Scende') : '',
        ROUND.has(ob.type) ? '' : tool(false, 'objRotate', '', objIcon({ ...sample, rot: ob.rot }), `Ruota (${ob.rot * 90}°)`),
        ob.type === 'hole' || ob.type === 'pit' ? tool(ob.ladder, 'objToggle', 'data-f="ladder"', objIcon({ ...sample, ladder: true, ruined: false }), 'Con scala a pioli') : '',
        VEG.has(ob.type) ? VEG_STATES.map(([v, l]) => tool((ob.veg || 'lush') === v, 'objSet', `data-f="veg" data-v="${v}"`, objIcon({ type: ob.type, ruined: v === 'dry', inf: v === 'inf' }), l)).join('')
          : ob.type === 'well' || ((ob.type === 'hole' || ob.type === 'pit') && !ob.ladder) ? '' : tool(ob.ruined, 'objToggle', 'data-f="ruined"', objIcon({ ...sample, ruined: true }), ruinLabel(ob.type)),
      ].join('')) : '');
    hint = ob.type === 'erase' ? 'Clic su un oggetto per toglierlo.'
      : ob.type === 'ruin' ? 'Clic su un oggetto per romperlo o ripararlo, anche durante la partita (le scale diventano inagibili, le piante secche).'
      : 'Clic sul quadretto dove mettere l\'oggetto; trascina un oggetto per spostarlo. Le scale che salgono o scendono, e i buchi nel soffitto o nel pavimento, compaiono da soli (tratteggiati) sul piano collegato.'
        + (VEG.has(ob.type) ? ' Clic su una pianta uguale già messa per cambiarne lo stato.' : '');
  }
  return `<div class="panel"><div class="row" style="justify-content:space-between"><h2>Impostazioni della mappa</h2><button data-do="mapDel" data-arg="${cur.id}">Elimina mappa</button></div>
      <div class="grid">
        <div><label>Nome</label><input data-m="name" data-mid="${cur.id}" value="${esc(cur.name)}" aria-label="Nome mappa"></div>
        ${M_('cols', 'Tasselli in larghezza')}${M_('rows', 'Tasselli in altezza')}
        <div><label>Giocatori</label><label class="row" style="gap:6px;text-transform:none;letter-spacing:0;font-size:14px;color:inherit"><input type="checkbox" data-m="visible" data-mid="${cur.id}" ${cur.visible ? 'checked' : ''}> mostra ai giocatori</label></div>
      </div>
      <p class="muted" style="margin-bottom:0">${cur.cols * TILE}×${cur.rows * TILE} quadretti = ${cur.cols * 15}×${cur.rows * 15} m · ogni tassello è 10×10 quadretti (15 m di lato)</p></div>
    ${stage(`
      ${levelBar}
      <div class="row" style="gap:8px;margin-bottom:12px">
        <div style="flex:1;min-width:160px"><label>Nome del piano</label><input data-lv="name" data-mid="${cur.id}" data-lid="${lv.id}" value="${esc(lv.name)}" aria-label="Nome del piano"></div>
        ${cur.levels.length > 1 ? `<button data-do="levelDel" data-arg="${lv.id}" data-mid="${cur.id}" style="align-self:end">Elimina piano</button>` : ''}
      </div>
      <nav class="maptabs" style="margin-bottom:12px">
        <button data-do="mapMode" data-arg="brush" class="${mode === 'brush' ? 'on' : ''}">Dipingi tasselli</button>
        <button data-do="mapMode" data-arg="edge" class="${mode === 'edge' ? 'on' : ''}">Porte, finestre e passaggi</button>
        <button data-do="mapMode" data-arg="obj" class="${mode === 'obj' ? 'on' : ''}">Oggetti, arredo e natura</button>
        <button data-do="mapMode" data-arg="tok" class="${mode === 'tok' ? 'on' : ''}">Personaggi</button>
      </nav>
      ${tools}
      <p class="muted" style="margin-bottom:0">${hint}</p>`, mapSvg(view, mode))}`;
}

function setMaps(f) {
  const ms = structuredClone(S.maps || []);
  ms.forEach(levelsOf);
  f(ms);
  S.maps = ms;
  render();
  act('maps', { maps: ms });
}

// Sposta un segnalino subito in locale, poi lo manda al server.
function moveToken(mid, cid, pos) {
  const m = S.maps.find(x => x.id === mid);
  m.tokens = { ...m.tokens };
  if (pos) {
    // tutto il segnalino deve stare dentro la mappa
    const n = Math.max(1, space(S.characters[cid]));
    pos = { ...pos, x: Math.min(m.cols * TILE - n, Math.max(0, pos.x)), y: Math.min(m.rows * TILE - n, Math.max(0, pos.y)) };
    m.tokens[cid] = pos;
  } else delete m.tokens[cid];
  render();
  act('token', pos ? { map: mid, char: cid, ...pos } : { map: mid, char: cid, remove: true });
}

function mapClick(e) {
  if (dragged) return;
  const svg = e.target.closest('#mapsvg'), m = S.maps.find(x => x.id === svg.dataset.id);
  if (!M() || ui.mapMode === 'tok') {
    const c = S.characters[ui.tokChar];
    if (!c || !(M() || c.owner === S.me.id)) return;
    const [sx, sy] = toMap(svg, e), off = Math.floor((Math.max(1, space(c)) - 1) / 2); // il quadretto cliccato sta al centro
    return moveToken(m.id, c.id, { lv: curLevel(m).id, x: Math.floor(sx) - off, y: Math.floor(sy) - off });
  }
  const r = svg.getBoundingClientRect(), W = m.cols * TILE, H = m.rows * TILE;
  // il viewBox ha mezzo quadretto di margine per lato
  const sx = (e.clientX - r.left) / r.width * (W + 1) - .5, sy = (e.clientY - r.top) / r.height * (H + 1) - .5;
  const tx = Math.min(m.cols - 1, Math.max(0, Math.floor(sx / TILE))), ty = Math.min(m.rows - 1, Math.max(0, Math.floor(sy / TILE)));
  setMaps(ms => {
    const map = ms.find(x => x.id === m.id), lv = curLevel(map);
    lv.tiles ??= {};
    lv.edges ??= {};
    lv.objects ??= [];
    if (ui.mapMode === 'obj') {
      const qx = Math.min(W - 1, Math.max(0, Math.floor(sx))), qy = Math.min(H - 1, Math.max(0, Math.floor(sy)));
      const inside = o => { const [fw, fh] = footprint(o); return qx >= o.x && qx < o.x + fw && qy >= o.y && qy < o.y + fh; };
      let hit = lv.objects.findLastIndex(o => !FLAT.has(o.type) && inside(o)); // i tappeti stanno sotto: prima ciò che c'è sopra
      if (hit < 0) hit = lv.objects.findLastIndex(inside);
      const { type, rot, dir, ruined, ladder, veg = 'lush' } = ui.obj, h = lv.objects[hit];
      if (type === 'erase') { if (hit >= 0) lv.objects.splice(hit, 1); return; }
      if (type === 'ruin') { if (h && h.type !== 'well') { h.ruined = !h.ruined; delete h.inf; } return; }
      if (!OBJ[type]) return;
      const plant = VEG.has(type) && { ruined: veg === 'dry', inf: veg === 'inf' };
      if (plant && h?.type === type) return Object.assign(h, plant); // clic su una pianta uguale: ne cambia lo stato
      const o = { id: rid(), type, rot: ROUND.has(type) ? 0 : rot, dir, ruined: type !== 'well' && ruined, ladder, ...plant };
      const [fw, fh] = footprint(o);
      // il quadretto cliccato sta al centro dell'oggetto
      o.x = Math.min(W - fw, Math.max(0, qx - Math.floor((fw - 1) / 2)));
      o.y = Math.min(H - fh, Math.max(0, qy - Math.floor((fh - 1) / 2)));
      lv.objects.push(o);
      return;
    }
    if (ui.mapMode === 'edge') {
      // prima le porte spostate a mano: apri/chiudi, cambia in porta o finestra, oppure togli (muro)
      const fd = (lv.doors || []).findIndex(dr => (dr.v ? Math.abs(sx - dr.x) < .6 && sy > dr.y && sy < dr.y + dr.n : Math.abs(sy - dr.y) < .6 && sx > dr.x && sx < dr.x + dr.n));
      if (fd >= 0) {
        const dr = lv.doors[fd], t = ui.edgeTool;
        if (t === 'toggle') dr.s = TOGGLE[dr.s] ?? dr.s;
        else if (GLYPH.has(num(t))) dr.s = num(t);
        else lv.doors.splice(fd, 1);
        return;
      }
      // il lato più vicino al punto cliccato
      const lx = sx - tx * TILE, ly = sy - ty * TILE;
      const d = [['w', lx], ['e', TILE - lx], ['n', ly], ['s', TILE - ly]].sort((a, b) => a[1] - b[1])[0][0];
      const k = edgeKey(tx, ty, d), cur = lv.edges[k] || 0;
      const next = ui.edgeTool === 'toggle' ? TOGGLE[cur] ?? cur : num(ui.edgeTool);
      if (next) lv.edges[k] = next; else delete lv.edges[k];
      return;
    }
    const { kind, w, terrain } = ui.brush, key = tx + ',' + ty;
    if (kind === 'vuoto') {
      delete lv.tiles[key];
      for (const d of 'nesw') delete lv.edges[edgeKey(tx, ty, d)];
      return;
    }
    lv.tiles[key] = { kind, w: num(w), terrain, ...(terrain === 'acqua' && { water: hex(ui.brush.water) }) };
    // un corridoio si collega da solo a ciò che ha accanto (e una stanza ai corridoi vicini)
    for (const [d, nx, ny] of [['n', tx, ty - 1], ['s', tx, ty + 1], ['w', tx - 1, ty], ['e', tx + 1, ty]]) {
      const n = lv.tiles[nx + ',' + ny];
      if (n && (kind === 'corr' || n.kind === 'corr') && !lv.edges[edgeKey(tx, ty, d)]) lv.edges[edgeKey(tx, ty, d)] = 1;
    }
  });
}

// Trascinare un oggetto lo sposta, trascinare una porta o finestra la fa scorrere lungo i muri; un clic senza movimento resta un clic.
let drag = null, dragged = false;
const toMap = (svg, e) => { const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; return [(e.clientX - r.left) / r.width * vb.width + vb.x, (e.clientY - r.top) / r.height * vb.height + vb.y]; };
addEventListener('pointerdown', e => {
  const g = e.button === 0 && e.target.closest?.('#mapsvg [data-oid], #mapsvg [data-door], #mapsvg [data-tok]');
  if (!g) return;
  drag = { g, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, moved: false };
  if (g.dataset.door) {
    const m = S.maps.find(x => x.id === g.ownerSVGElement.dataset.id), view = { ...structuredClone(curLevel(m)), cols: m.cols, rows: m.rows };
    if (g.dataset.ek) delete view.edges[g.dataset.ek]; // la porta lascia il suo varco: lì torna il muro
    drag.door = { view, F: floorOf(view).F, n: +g.dataset.n, s: +g.dataset.s, at: null };
  }
});
addEventListener('pointermove', e => {
  if (!drag) return;
  const svg = drag.g.ownerSVGElement, k = svg.viewBox.baseVal.width / svg.getBoundingClientRect().width;
  drag.moved ||= Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 5;
  if (!drag.moved) return;
  if (drag.door) {
    const at = doorSnap(drag.door, ...toMap(svg, e));
    if (at) { drag.door.at = at; drag.g.innerHTML = doorGlyph(drag.door.F, at, drag.door.s); }
    drag.g.classList.add('dragging');
    return;
  }
  drag.dx = Math.round((e.clientX - drag.x0) * k);
  drag.dy = Math.round((e.clientY - drag.y0) * k);
  drag.g.classList.add('dragging');
  drag.g.setAttribute('transform', `translate(${drag.dx} ${drag.dy})`);
});
addEventListener('pointerup', () => {
  const d = drag;
  drag = null;
  if (!d?.moved) return;
  dragged = true;
  setTimeout(() => { dragged = false; }); // il click che segue il rilascio non deve posare un nuovo oggetto
  const mid = d.g.ownerSVGElement.dataset.id;
  if (d.door) {
    if (!d.door.at) return render();
    return setMaps(ms => {
      const lv = curLevel(ms.find(x => x.id === mid)), { ek, did } = d.g.dataset;
      lv.doors ??= [];
      if (ek) { delete lv.edges[ek]; lv.doors.push({ id: rid(), s: d.door.s, ...d.door.at }); }
      else Object.assign(lv.doors.find(x => x.id === did) || {}, d.door.at);
    });
  }
  const cid = d.g.dataset.tok, t = cid && S.maps.find(x => x.id === mid)?.tokens?.[cid];
  if (cid) {
    const m = S.maps.find(x => x.id === mid);
    if (t) moveToken(mid, cid, { lv: t.lv, x: Math.min(m.cols * TILE - 1, Math.max(0, t.x + d.dx)), y: Math.min(m.rows * TILE - 1, Math.max(0, t.y + d.dy)) });
    return;
  }
  setMaps(ms => {
    const m = ms.find(x => x.id === mid), o = curLevel(m).objects?.find(x => x.id === d.g.dataset.oid);
    if (!o) return;
    const [fw, fh] = footprint(o);
    o.x = Math.min(m.cols * TILE - fw, Math.max(0, o.x + d.dx));
    o.y = Math.min(m.rows * TILE - fh, Math.max(0, o.y + d.dy));
  });
});

// Chiave stabile di un campo, per non perdere quello che stai scrivendo quando arriva un aggiornamento.
const keyOf = el => el.dataset?.p ? el.dataset.c + el.dataset.p : el.dataset?.t ? 't' + el.dataset.t + el.dataset.f : el.dataset?.h ? 'h' + el.dataset.h + el.dataset.f
  : el.dataset?.m ? 'm' + el.dataset.m : el.dataset?.lv ? 'lv' + el.dataset.lid : ['mnotes', 'story'].includes(el.id) ? el.id : null;

// Non ridisegnare mentre il mouse è premuto, altrimenti il click sul bottone sostituito va perso.
let pressed = false, pending = false;
addEventListener('pointerdown', () => { pressed = true; }, true);
addEventListener('pointerup', () => { pressed = false; if (pending) { pending = false; setTimeout(render); } }, true);

// Su schermi stretti i dadi stanno in un pannello a scomparsa: l'ultimo tiro compare in una notifica.
const narrow = matchMedia('(max-width: 1100px)');
let lastRoll, lastCamp, toastTimer;
function rollHtml(r) {
  const nat = /^1d20\[(20|1)\]/.exec(r.detail);
  return `<span class="tot">${r.total}</span><b>${esc(r.who)}</b> ${esc(r.label)}${r.secret ? ' 🔒' : ''}
    <br><small class="muted">${esc(r.expr)} → ${esc(r.detail)}</small>${nat ? ` <span class="crit">${nat[1] === '20' ? '20 naturale!' : '1 naturale'}</span>` : ''}`;
}
function toast(r) {
  if (!narrow.matches || document.body.classList.contains('dice-open')) return;
  const el = $('#toast');
  el.innerHTML = rollHtml(r);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
}
function setDice(open) {
  document.body.classList.toggle('dice-open', open);
  $('#dicefab').setAttribute('aria-expanded', open);
  if (open) $('#toast').classList.remove('show');
}

function render() {
  if (!S) return;
  if (pressed) { pending = true; return; }
  $('nav').innerHTML = [['sheets', 'Schede'], ['combat', 'Combattimento'], ['handouts', M() ? 'Handout e note' : 'Handout'], ['story', 'Storia'], ['maps', 'Mappe']]
    .map(([t, l]) => `<button data-do="tab" data-arg="${t}" class="${ui.tab === t ? 'on' : ''}">${l}</button>`).join('');
  const campName = S.campaigns.find(c => c.id === S.active)?.name;
  const camp = `<select id="campsel" aria-label="Campagna" style="width:auto">${S.campaigns.map(c => `<option value="${c.id}" ${c.id === S.active ? 'selected' : ''}>${esc(c.name)}${c.id === S.live ? ' ▶ in gioco' : ''}</option>`).join('')}</select>
    ${M() ? '<button data-do="campRename">Rinomina</button><button data-do="campNew">+ Campagna</button>'
      : S.active !== S.live ? '<span class="muted">stai sfogliando, non è la campagna in gioco</span>' : ''}`;
  // riscrive solo se cambia, così il menu a tendina non si chiude a ogni aggiornamento
  if ($('#camp').dataset.html !== camp) { $('#camp').innerHTML = camp; $('#camp').dataset.html = camp; }
  document.title = `${campName} · Tavolo D&D 3.5`;
  $('#who').textContent = `${S.me.name} (${M() ? 'master' : 'giocatore'})`;
  $('#secretwrap').hidden = !M();
  const last = S.rolls.at(-1);
  // notifica solo per tiri nuovi nella stessa campagna, non quando si cambia campagna
  if (S.active === lastCamp && last && last.id !== lastRoll) toast(last);
  lastCamp = S.active; lastRoll = last?.id;
  $('#log').innerHTML = S.rolls.slice().reverse().map(r => `<div>${rollHtml(r)}</div>`).join('') || '<p class="muted">Nessun tiro.</p>';

  const a = document.activeElement, key = a && keyOf(a);
  const keep = key && { v: a.value, s: a.selectionStart, e: a.selectionEnd };
  // la mappa e la tavolozza non devono tornare in cima a ogni clic
  const sk = [...$('#main').querySelectorAll('[data-sk]')].map(el => [el.dataset.sk, el.scrollLeft, el.scrollTop]);
  document.body.dataset.tab = ui.tab;
  $('#main').innerHTML = ({ sheets, combat, handouts, story, maps }[ui.tab] || sheets)();
  for (const [k, l, t] of sk) { const el = $(`#main [data-sk="${k}"]`); if (el) { el.scrollLeft = l; el.scrollTop = t; } }
  if (keep) {
    const el = [...$('#main').querySelectorAll('input,textarea,select')].find(x => keyOf(x) === key);
    if (el) {
      if (el.type !== 'checkbox') el.value = keep.v;
      el.focus();
      try { el.setSelectionRange(keep.s, keep.e); } catch {}
    }
  }
}

// --- Combattimento (solo master) ---
function setTracker(f) {
  const t = structuredClone(S.tracker);
  f(t);
  t.turn = Math.min(t.turn, Math.max(0, t.list.length - 1));
  S.tracker = t;
  render();
  act('tracker', { tracker: t });
}
const d20 = () => 1 + Math.floor(Math.random() * 20);
const byInit = t => { t.list.sort((a, b) => num(b.init) - num(a.init)); t.turn = 0; };

const handlers = {
  tab: a => { ui.tab = a; saveUi(); render(); },
  diceToggle: () => setDice(!document.body.classList.contains('dice-open')),
  pick: a => { ui.charId = a; saveUi(); render(); },
  async newChar() {
    const r = await act('char.create', { data: { name: 'Nuovo personaggio', skills: SKILLS.map(([name, ab, acp]) => ({ name, ab, acp: !!acp })) } });
    if (r.id) { ui.charId = r.id; saveUi(); render(); }
  },
  delChar: a => confirm(`Eliminare definitivamente "${S.characters[a]?.name}"?`) && act('char.delete', { id: a }),
  addRow: (_, d) => {
    const c = S.characters[d.c];
    act('char.set', { id: c.id, path: [d.list], value: [...(c[d.list] || []), d.list === 'skills' ? { name: '', ab: 'int' } : {}] });
  },
  delRow: (_, d) => {
    const c = S.characters[d.c];
    act('char.set', { id: c.id, path: [d.list], value: c[d.list].filter((_, i) => i !== +d.i) });
  },
  tNext: () => setTracker(t => { if (++t.turn >= t.list.length) { t.turn = 0; t.round++; } }),
  tAddNpc: () => setTracker(t => t.list.push({ id: rid(), name: 'PNG', init: '', initMod: '', hp: '', maxHp: '', ac: '', cond: '', hidden: false })),
  tAddPcs: () => setTracker(t => Object.values(S.characters).filter(c => !t.list.some(x => x.charId === c.id)).forEach(c => t.list.push({ id: rid(), charId: c.id, init: '', cond: '' }))),
  tRollInit: () => setTracker(t => {
    t.list.forEach(x => { if (x.init === '' || x.init === undefined) { const c = S.characters[x.charId]; x.init = d20() + (c ? calc(c).init : num(x.initMod)); } });
    byInit(t);
  }),
  tSort: () => setTracker(byInit),
  tMove: (a, d) => setTracker(t => {
    const i = +a, j = i + +d.d;
    if (j < 0 || j >= t.list.length) return;
    [t.list[i], t.list[j]] = [t.list[j], t.list[i]];
    if (t.turn === i) t.turn = j; else if (t.turn === j) t.turn = i; // il turno segue chi stava agendo
  }),
  tDel: a => setTracker(t => { if (+a < t.turn) t.turn--; t.list.splice(+a, 1); }),
  tReset: () => confirm('Terminare il combattimento e svuotare il tracker?') && setTracker(t => { t.list = []; t.round = 1; t.turn = 0; }),
  zoom: a => {
    // tiene al centro lo stesso punto della mappa
    const sc = $('.mapscroll'), svg = sc.querySelector('svg'), now = ui.mapZoom || svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
    const fx = (sc.scrollLeft + sc.clientWidth / 2) / sc.scrollWidth, fy = (sc.scrollTop + sc.clientHeight / 2) / sc.scrollHeight;
    ui.mapZoom = +a ? Math.round(Math.min(80, Math.max(6, now * (+a > 0 ? 1.25 : .8)))) : 0;
    saveUi();
    render();
    const n = $('.mapscroll');
    n.scrollLeft = fx * n.scrollWidth - n.clientWidth / 2;
    n.scrollTop = fy * n.scrollHeight - n.clientHeight / 2;
  },
  mapFull: () => {
    ui.mapFull = !ui.mapFull;
    // anche il browser a tutto schermo, se lo permette; Esc esce da entrambi
    if (ui.mapFull) document.documentElement.requestFullscreen?.().catch(() => {});
    else if (document.fullscreenElement) document.exitFullscreen();
    render();
  },
  palMin: () => { ui.palMin = !ui.palMin; saveUi(); render(); },
  palDock: () => { ui.palPos = null; saveUi(); render(); },
  mapMode: a => { ui.mapMode = a; saveUi(); render(); },
  brushSet: (_, d) => { ui.brush = { ...ui.brush, [d.f]: d.f === 'w' ? num(d.v) : d.v }; saveUi(); render(); },
  edgeTool: a => { ui.edgeTool = a === 'toggle' ? a : num(a); saveUi(); render(); },
  objSet: (_, d) => { ui.obj = { ...ui.obj, [d.f]: d.v }; saveUi(); render(); },
  objToggle: (_, d) => { ui.obj = { ...ui.obj, [d.f]: !ui.obj[d.f] }; saveUi(); render(); },
  objRotate: () => { ui.obj = { ...ui.obj, rot: (ui.obj.rot + 1) % 4 }; saveUi(); render(); },
  tokPick: a => { ui.tokChar = ui.tokChar === a ? null : a; saveUi(); render(); },
  tokRemove: (a, d) => moveToken(d.mid, a, null),
  levelPick: (a, d) => { ui.levels = { ...ui.levels, [d.mid]: a }; saveUi(); render(); },
  levelAdd: (a, d) => setMaps(ms => {
    const m = ms.find(x => x.id === d.mid), zs = m.levels.map(l => l.z);
    const z = a === 'up' ? Math.max(...zs) + 1 : Math.min(...zs) - 1;
    const l = { id: rid(), z, name: levelName(z), tiles: {}, edges: {}, objects: [] };
    m.levels.push(l);
    ui.levels = { ...ui.levels, [m.id]: l.id };
    saveUi();
  }),
  levelDel: (a, d) => {
    const l = S.maps.find(x => x.id === d.mid)?.levels.find(x => x.id === a);
    if (l && confirm(`Eliminare il piano "${l.name}" con tutto quello che contiene?`)) setMaps(ms => { const m = ms.find(x => x.id === d.mid); m.levels = m.levels.filter(x => x.id !== a); });
  },
  mapNew: () => {
    const name = prompt('Nome della mappa', 'Nuova mappa');
    if (!name) return;
    const m = { id: rid(), name, cols: 6, rows: 4, visible: false, levels: [{ id: rid(), z: 0, name: 'Piano terra', tiles: {}, edges: {}, objects: [] }] };
    ui.mapId = m.id;
    saveUi();
    setMaps(ms => ms.push(m));
  },
  mapDel: a => confirm(`Eliminare la mappa "${S.maps.find(m => m.id === a)?.name}"?`) && setMaps(ms => ms.splice(ms.findIndex(m => m.id === a), 1)),
  campNew: () => { const name = prompt('Nome della nuova campagna'); if (name) act('campaign.create', { name }); },
  campRename: () => {
    const name = prompt('Nuovo nome della campagna', S.campaigns.find(c => c.id === S.active)?.name);
    if (name) act('campaign.rename', { name });
  },
  hNew: () => act('handouts', { handouts: [...S.handouts, { id: rid(), title: '', text: '', visible: false }] }),
  hDel: a => confirm('Eliminare questo handout?') && act('handouts', { handouts: S.handouts.filter((_, i) => i !== +a) }),
  async logout() { await fetch('/api/logout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }); location.reload(); },
};

addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  setDice(false);
  if (ui.mapFull && !document.fullscreenElement) { ui.mapFull = false; render(); }
});
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && ui.mapFull) { ui.mapFull = false; render(); } });

// La tavolozza si stacca e si sposta trascinandone la testata.
let pal = null;
addEventListener('pointerdown', e => {
  const h = e.button === 0 && !e.target.closest('button') && e.target.closest?.('.palhead');
  if (!h || narrow.matches) return;
  const r = h.parentElement.getBoundingClientRect();
  pal = { el: h.parentElement, dx: e.clientX - r.left, dy: e.clientY - r.top };
  e.preventDefault();
});
addEventListener('pointermove', e => {
  if (!pal) return;
  pal.x = Math.max(0, Math.min(innerWidth - 160, e.clientX - pal.dx));
  pal.y = Math.max(0, Math.min(innerHeight - 50, e.clientY - pal.dy));
  pal.el.classList.add('floating');
  Object.assign(pal.el.style, { left: pal.x + 'px', top: pal.y + 'px' });
});
addEventListener('pointerup', () => {
  const p = pal;
  pal = null;
  if (p?.x !== undefined) { ui.palPos = { x: p.x, y: p.y }; saveUi(); render(); }
});
narrow.addEventListener('change', () => setDice(false));

document.addEventListener('click', e => {
  if (e.target.closest('#scrim')) return setDice(false);
  if (e.target.closest('#toast')) return setDice(true);
  if (e.target.closest('#mapsvg')) return mapClick(e);
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.roll) act('roll', { expr: d.roll, label: d.label });
  else if (d.qd) act('roll', { expr: d.qd, label: $('#rlabel').value, secret: $('#secret').checked });
  else if (d.do) handlers[d.do](d.arg, d);
});

document.addEventListener('change', e => {
  const el = e.target, d = el.dataset, val = el.type === 'checkbox' ? el.checked : el.value;
  if (d.p) {
    const path = JSON.parse(d.p);
    // aggiorna subito in locale, così i totali si ricalcolano senza aspettare il server
    let o = S.characters[d.c];
    for (const k of path.slice(0, -1)) o = o[k] = o[k] && typeof o[k] === 'object' ? o[k] : {};
    o[path.at(-1)] = val;
    render();
    act('char.set', { id: d.c, path, value: val });
  } else if (d.owner) act('char.owner', { id: d.c, owner: el.value });
  else if (d.t) setTracker(t => { t.list[+d.t][d.f] = val; });
  else if (d.h) act('handouts', { handouts: S.handouts.map((h, i) => (i === +d.h ? { ...h, [d.f]: val } : h)) });
  else if (el.id === 'mnotes') act('notes', { notes: val });
  else if (el.id === 'story') act('story', { story: val });
  else if (d.m) setMaps(ms => {
    const m = ms.find(x => x.id === d.mid);
    m[d.m] = d.m === 'cols' || d.m === 'rows' ? Math.min(12, Math.max(1, parseInt(val) || 1)) : val;
  });
  else if ('water' in d) { ui.brush = { ...ui.brush, water: hex(val) }; saveUi(); render(); }
  else if (d.lv) setMaps(ms => { const l = ms.find(x => x.id === d.mid).levels.find(x => x.id === d.lid); l.name = val || l.name; });
  else if (el.id === 'campsel') act('campaign.select', { id: val });
  else if (el.id === 'mappick') { ui.mapId = val; saveUi(); render(); }
});

$('#rollform').addEventListener('submit', async e => {
  e.preventDefault();
  const expr = $('#expr').value.trim();
  if (!expr) return;
  const r = await act('roll', { expr, label: $('#rlabel').value, secret: $('#secret').checked });
  if (r.ok) $('#rlabel').value = '';
});

$('#loginform').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: f.get('name'), pin: f.get('pin') }) });
  if (r.ok) boot();
  else $('#lerr').textContent = (await r.json().catch(() => ({}))).error || 'Errore';
});

async function boot() {
  const r = await fetch('/api/me').catch(() => null);
  if (!r || r.status === 401) { $('#login').hidden = false; $('#app').hidden = true; return; }
  $('#login').hidden = true;
  $('#app').hidden = false;
  const es = new EventSource('/api/events');
  es.onmessage = e => { S = JSON.parse(e.data); render(); };
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) setTimeout(boot, 2000); };
}
boot();
</script>
